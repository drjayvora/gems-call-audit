    status: TO ADD – Jay to share the full campus list with status and curriculum.
    verify: true

fees:
  policy: Central desk does NOT quote fees on the phone. The approved answer is that the campus counsellor shares
    the fee structure at the visit. Quoting any figure (even a rough range) is a fee_issue flag.

facilities_and_unknowns:
  rule: If a parent asks about meals, daycare, transport or anything the counsellor doesn't know, the correct answer is
    "the campus counsellor will confirm this at your visit". Deferring like that is correct. Guessing or saying
    "I'm not sure, maybe..." is an uncertain_info flag.
  transport: Available (confirm per campus).

process:
  - The central admissions desk books campus visits with the campus counsellor; fees and the full tour happen at the visit.
  - The central desk has no WhatsApp. When a parent asks for details, the approved route is to email them the brochure.
    Not offering the brochure when details are asked for counts against Questions & objections.

# Misheard brand/curriculum words, fixed after transcription (whole words, any case).
