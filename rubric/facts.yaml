# Approved fact sheet the scorer checks claims against. Anything a counsellor says that isn't here
# gets flagged as "unverifiable", so filling this in is the fastest way to make knowledge scoring fair.
# Entries marked "verify: true" are provisional (heard on calls, not yet confirmed by admissions):
# contradicting them is flagged as unverifiable, not as wrong.
# Last updated 2026-10-16: fee policy, brand claims, IB wording, unknowns and brochure process confirmed by Jay.

brand:
  approved:
    - GEMS Education was founded in Dubai in 1959. ("65+ years" follows from this and is fine.)
    - Non-numeric descriptions are fine, e.g. "an international education group", "holistic development", "experiential learning".
  not_approved: Any other numbers about GEMS (count of schools or campuses, countries, students, alumni, years in India,
    rankings) and sweeping claims such as "every child in Dubai goes to GEMS". Flag as inaccurate_claim.

